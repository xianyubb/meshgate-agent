name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  windows-clang:
    name: Windows x64 (clang-cl, Release)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Build (server variant)
        run: |
          xmake f -m release --target_type=server -y
          xmake build -y

      - name: Package (server variant)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse bin/meshgate-agent dist/meshgate-agent
          Compress-Archive -Path dist/meshgate-agent -DestinationPath meshgate-agent-server-windows-x64.zip

      - name: Write release notes
        shell: pwsh
        run: |
          @"
          meshgate-agent 首个发行版本：LeviLamina 上的 MeshGate 命令桥接模组，需配合 MeshGate 中继使用。

          ## 亮点

          - 从 MeshGate Login 的 `DeviceModel` / `DeviceId` carrier 读取玩家 XUID。
          - 在 BDS Login 校验与创建玩家阶段恢复 XUID、UUID、PlayFabId、Xbox Live 名称与公钥，并标记为完整认证身份。
          - 提供 LeviLamina 服务端形态的发行包。完整变更见仓库 `CHANGELOG.md`。

          ## 安装

          - `meshgate-agent-server-windows-x64.zip`：服务端模组，解压至服务器 `plugins/` 目录。
          - 亦可通过 `tooth.json` 使用 lip 安装，资产地址已指向本 Release。
          "@ | Set-Content -Encoding utf8 release-notes.md

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            meshgate-agent-server-windows-x64.zip `
            --title "meshgate-agent ${{ github.ref_name }}" `
            --notes-file release-notes.md
