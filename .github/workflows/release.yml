name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  windows-clang:
    name: Windows x64 (clang-cl, Release)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Build (server variant)
        run: |
          xmake f -m release --target_type=server -y
          xmake build -y

      - name: Package (server variant)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse bin/meshgate-agent dist/meshgate-agent
          Compress-Archive -Path dist/meshgate-agent -DestinationPath meshgate-agent-server-windows-x64.zip

      - name: Write release notes
        shell: pwsh
        run: |
          @"
          meshgate-agent 补丁版本：改善传送失败提示并更新 LeviLamina 兼容性。

          ## 修复

          - `/meshgate` 传送失败时仅显示 MeshGate 返回的简明原因，不再输出原始 HTTP 响应。
          - 移除 LeviLamina 26.20.7 已不存在的 DedicatedServer 初始化钩子。

          ## 安装

          - `meshgate-agent-server-windows-x64.zip`：服务端模组，解压至服务器 `plugins/` 目录。
          - 亦可通过 `tooth.json` 使用 lip 安装，资产地址已指向本 Release。
          "@ | Set-Content -Encoding utf8 release-notes.md

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            meshgate-agent-server-windows-x64.zip `
            --title "meshgate-agent ${{ github.ref_name }}" `
            --notes-file release-notes.md
